<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>UKG Pro</title>
<style>
:root{
  --brand:#005151;          /* UKG green, ?accent= overrides */
  --brand-dk:#003A3A;
  --brand-lt:#E3F1EE;
  --lime:#5BE39A;
  --ink:#1C2321;--ink-2:#4B5653;--ink-3:#7E8A86;
  --bg:#F1F4F3;--surface:#FFFFFF;--surface-2:#F5F8F7;--line:#DFE6E3;
  --ok:#1A7F4B;--ok-bg:#E6F4EC;--warn:#9A5B00;--warn-bg:#FFF3DF;--info:#1F5FAE;--info-bg:#E8F0FB;--bad:#B42318;--bad-bg:#FDECEA;
  --r:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- SSO handoff ---------- */
#sso{position:fixed;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;z-index:50;text-align:center}
.sso-logo{margin-bottom:28px}
.ukg{display:inline-flex;align-items:center;gap:10px}
.ukg .mark{width:40px;height:40px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.ukg .mark svg{width:24px;height:24px;fill:none;stroke:var(--lime);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ukg .wm{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--brand);line-height:1}
.ukg .wm small{font-size:14px;font-weight:600;letter-spacing:0;color:var(--ink-3);margin-left:6px;vertical-align:middle}
.sso-step{font-size:15px;color:var(--ink-2);min-height:22px;margin-top:14px}
.sso-user{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:999px;padding:8px 16px 8px 8px;margin-top:22px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.sso-user.on{opacity:1;transform:none}
.sso-user .av{width:36px;height:36px}
.sso-user b{font-size:14px;display:block}
.sso-user small{color:var(--ink-3);font-size:12px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{width:34px;height:34px;border-radius:50%;background:var(--ok);display:none;place-items:center}
.tick svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none}
.sso-foot{position:absolute;bottom:26px;left:0;right:0;font-size:12px;color:var(--ink-3)}

/* ---------- avatar ---------- */
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;flex:none;background-size:cover;background-position:center}

/* ---------- app shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;height:56px;display:flex;align-items:center;padding:0 10px;gap:6px}
.bar .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#fff}
.bar .ib:active{background:rgba(255,255,255,.14)}
.bar .ib svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bar .ttl{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .logo{display:flex;align-items:center;gap:8px;flex:1}
.bar .logo .wm{font-size:20px;font-weight:800;letter-spacing:-.6px;color:#fff;line-height:1}
.bar .logo .co{font-size:12px;color:rgba(255,255,255,.75);margin-left:4px;padding-left:8px;border-left:1px solid rgba(255,255,255,.35)}
.bar .av{background:#fff;color:var(--brand);width:32px;height:32px}

.page{flex:1;padding:14px 14px 96px;max-width:560px;width:100%;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card .ch{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.card .ch h3{margin:0;font-size:15px;font-weight:700}
.card .ch button.lnk{font-size:13px;font-weight:600;color:var(--brand)}
.card .cb{padding:6px 14px 14px}
.muted{color:var(--ink-3);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%}
.row:first-child{border-top:0}
.row .ic{width:38px;height:38px;border-radius:10px;background:var(--brand-lt);color:var(--brand);display:grid;place-items:center;flex:none}
.row .ic svg,.clock .ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px;font-weight:600}
.row .tx small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.row .rt{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;stroke:var(--ink-3);stroke-width:2;fill:none;flex:none}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}

.greet{padding:4px 2px 12px}
.greet h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.greet p{margin:4px 0 0;color:var(--ink-2);font-size:14px}

/* UKG home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:118px}
.tile .th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .th span{font-size:13px;font-weight:700;color:var(--ink-2)}
.tile .th svg{width:20px;height:20px;stroke:var(--brand);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile b{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.tile b i{font-style:normal;font-size:13px;font-weight:500;color:var(--ink-3);margin-left:4px}
.tile small{font-size:12px;color:var(--ink-3);margin-top:auto}
.tile.wide{grid-column:1/-1;min-height:0}
.tile .bars{display:flex;gap:4px;height:28px;align-items:flex-end}
.tile .bars i{flex:1;background:var(--brand-lt);border-radius:3px 3px 0 0}
.tile .bars i.f{background:var(--brand)}
.tile .bars i.t{background:var(--lime)}

.clock{display:flex;align-items:center;gap:12px;padding:12px 14px}
.clock .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-lt);color:var(--brand);display:grid;place-items:center;flex:none}
.clock .st{flex:1}
.clock .st b{font-size:15px;display:block}
.clock .st small{color:var(--ink-3);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;font-size:15px;height:46px;padding:0 20px;border-radius:8px;width:100%}
.btn.sm{height:38px;width:auto;font-size:14px;padding:0 16px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.out{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn:active{filter:brightness(.92)}

.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 14px 14px}
.stat{background:var(--surface-2);border-radius:8px;padding:12px}
.stat small{display:block;font-size:12px;color:var(--ink-3)}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.stat i{font-style:normal;font-size:12px;color:var(--ink-2)}

.ph{padding:6px 2px 14px}
.ph h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;text-align:center;font-size:13px;font-weight:600;padding:8px;border-radius:999px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* timecard / schedule lists */
.tc{list-style:none;margin:0;padding:0}
.tc li{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.tc li:first-child{border-top:0}
.tc .d{width:44px;text-align:center;flex:none}
.tc .d small{display:block;font-size:11px;color:var(--ink-3);font-weight:600}
.tc .d b{display:block;font-size:18px}
.tc .s{flex:1;min-width:0}
.tc .s b{display:block;font-size:14px}
.tc .s small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.tc .h{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tc li.today{background:var(--brand-lt)}
.tc li.today .d b{color:var(--brand)}
.tc li.off .s b{color:var(--ink-3);font-weight:500}
.exc{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--warn);margin-top:3px}
.exc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* form */
.form{padding:4px 14px 14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}
.f textarea{height:80px;padding:10px 12px;resize:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--ink-3);margin-top:6px}

/* pay */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv.tot{font-weight:700;background:var(--surface-2)}
.kv .l{flex:1}
.kv .l small{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.kv .v{font-variant-numeric:tabular-nums;white-space:nowrap}

/* control center */
.cc{padding:12px 14px;border-top:1px solid var(--line)}
.cc:first-child{border-top:0}
.cc .cth{display:flex;align-items:flex-start;gap:10px}
.cc .cth .ic{width:34px;height:34px;border-radius:50%;background:var(--brand-lt);color:var(--brand);display:grid;place-items:center;flex:none}
.cc .cth .ic svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cc .cth b{display:block;font-size:14px}
.cc .cth small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.cc .acts{display:flex;gap:8px;margin-top:10px;padding-left:44px}
.cc .acts .btn{height:36px;font-size:13px;width:auto;padding:0 14px}

/* bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--ink-3);position:relative}
#nav button svg{width:23px;height:23px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--brand)}
#nav button .bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

/* menu sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:.2s}
#scrim.on{opacity:1;pointer-events:auto}
#menu{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:320px;background:var(--surface);z-index:40;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#menu.on{transform:none}
.mh{background:var(--brand);color:#fff;padding:18px 16px}
.mh .av{width:48px;height:48px;font-size:17px;margin-bottom:10px;background:#fff;color:var(--brand)}
.mh b{display:block;font-size:16px}.mh small{font-size:12px;color:rgba(255,255,255,.8)}
.mi{display:flex;align-items:center;gap:14px;padding:13px 18px;font-size:15px;width:100%;color:var(--ink)}
.mi svg{width:21px;height:21px;stroke:var(--ink-2);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mi.on{color:var(--brand);background:var(--brand-lt)}.mi.on svg{stroke:var(--brand)}
.mdiv{height:1px;background:var(--line);margin:6px 0}
.mf{margin-top:auto;padding:14px 18px;font-size:11px;color:var(--ink-3)}
</style>
</head>
<body>

<!-- ============ SSO ============ -->
<div id="sso">
  <div class="sso-logo"><div class="ukg"><div class="mark"><svg viewBox="0 0 24 24"><path d="M5 7v6a4 4 0 0 0 8 0V7M15 7v10M15 12l5-5M15 12l5 5"/></svg></div><div class="wm">UKG<small>Pro</small></div></div></div>
  <div class="spinner" id="spin"></div>
  <div class="tick" id="tick"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>

</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <div class="bar" id="bar"></div>
  <div id="view" class="page"></div>
  <nav id="nav"></nav>
</div>

<div id="scrim"></div>
<nav id="menu">
  <div class="mh"><div class="av" id="menuAv"></div><b id="menuName"></b><small id="menuTitle"></small></div>
  <div id="menuItems"></div>
  <div class="mf">UKG Pro · <span id="menuCo"></span></div>
</nav>
<div id="toast"></div>

<script>
/* ===================== CONFIG =====================
   Override with URL params: ?name=&title=&company=&email=&accent=&photo=&currency=&skip=1
   Leave company/email blank to stay generic. */
var CFG={
  name:"Rachel Raffles",
  title:"Operator",
  company:"",
  email:"",
  accent:"",
  photo:"",
  currency:"£",
  skip:false
};
(function(){
  var q=new URLSearchParams(location.search);
  ["name","title","company","email","accent","photo","currency"].forEach(function(k){if(q.get(k)!==null)CFG[k]=q.get(k);});
  if(q.get("skip")==="1")CFG.skip=true;
  if(CFG.accent){var a=CFG.accent.replace(/^#?/,"#");document.documentElement.style.setProperty("--brand",a);}
})();
var INI=CFG.name.split(/\s+/).map(function(s){return s[0]||""}).join("").slice(0,2).toUpperCase();
function avatar(el){el.textContent=CFG.photo?"":INI;if(CFG.photo)el.style.backgroundImage="url('"+CFG.photo+"')";}
var CUR=CFG.currency;
function money(n){return CUR+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}

/* ===================== STATE ===================== */
var S={
  clockedIn:false,clockAt:null,
  accruals:{annual:11.5,sick:5,personal:1},
  requests:[
    {type:"Annual leave",from:"Fri 30 Oct",to:"Mon 2 Nov",days:2,status:"Approved"},
    {type:"Annual leave",from:"Mon 21 Sep",to:"Tue 22 Sep",days:2,status:"Approved"}
  ],
  notes:[
    {id:1,kind:"shift",title:"Shift swap request from Danny Ortiz",sub:"Wed 14 Oct · 06:00 – 14:00 for your Thu 15 Oct shift",act:true},
    {id:2,kind:"tc",title:"Timecard approval due",sub:"Approve your timecard for 28 Sep – 11 Oct by Wed 14 Oct",act:true},
    {id:3,kind:"open",title:"Open shift available",sub:"Sat 17 Oct · 14:00 – 22:00 · Main site",act:false},
    {id:4,kind:"ok",title:"Time off approved",sub:"Fri 30 Oct – Mon 2 Nov · 2 days",act:false}
  ],
  period:"this"
};
/* current pay period: Mon 12 – Sun 25 Oct, week 1 */
var TC=[
  {dn:"Mon",dd:12,in:"06:58",out:"15:03",h:8.0,sched:"07:00 – 15:00"},
  {dn:"Tue",dd:13,in:"",out:"",h:0,sched:"07:00 – 15:00",today:true},
  {dn:"Wed",dd:14,in:"",out:"",h:0,sched:"07:00 – 15:00"},
  {dn:"Thu",dd:15,in:"",out:"",h:0,sched:"07:00 – 15:00"},
  {dn:"Fri",dd:16,in:"",out:"",h:0,sched:"12:00 – 20:00"},
  {dn:"Sat",dd:17,in:"",out:"",h:0,sched:""},
  {dn:"Sun",dd:18,in:"",out:"",h:0,sched:""}
];
var LAST=[
  {dn:"Mon",dd:5,in:"07:00",out:"15:00",h:8},{dn:"Tue",dd:6,in:"07:04",out:"15:02",h:8},{dn:"Wed",dd:7,in:"07:12",out:"15:10",h:8,exc:"Late in"},{dn:"Thu",dd:8,in:"07:01",out:"17:08",h:10},{dn:"Fri",dd:9,in:"12:00",out:"20:05",h:8},{dn:"Sat",dd:10,in:"",out:"",h:0},{dn:"Sun",dd:11,in:"",out:"",h:0}
];
var RATE=14.50;
var PAY=[
  {period:"28 Sep – 11 Oct 2026",date:"16 Oct 2026",reg:76,ot:4},
  {period:"14 – 27 Sep 2026",date:"2 Oct 2026",reg:80,ot:2},
  {period:"31 Aug – 13 Sep 2026",date:"18 Sep 2026",reg:72,ot:0},
  {period:"17 – 30 Aug 2026",date:"4 Sep 2026",reg:80,ot:6}
];
PAY.forEach(function(p){
  p.regAmt=p.reg*RATE;p.otAmt=p.ot*RATE*1.5;p.gross=p.regAmt+p.otAmt;
  p.tax=Math.round(p.gross*0.118*100)/100;p.ni=Math.round(p.gross*0.058*100)/100;p.pens=Math.round(p.gross*0.04*100)/100;
  p.net=Math.round((p.gross-p.tax-p.ni-p.pens)*100)/100;p.hours=p.reg+p.ot;
});

/* ===================== ICONS ===================== */
var I={
  menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  inbox:'<svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></svg>',

function openMenu(o){document.getElementById("scrim").classList.toggle("on",o);document.getElementById("menu").classList.toggle("on",o);}

function buildMenu(){
  var el=document.getElementById("menuItems");el.innerHTML="";

    var b=document.createElement("button");b.className="mi"+(ROUTE===m[0]?" on":"");b.innerHTML=m[2]+"<span>"+m[1]+"</span>";
    b.onclick=function(){openMenu(false);if(m[0]==="profile"){toast("Not in this demo");return;}go(m[0]);};el.appendChild(b);
  });
  var d=document.createElement("div");d.className="mdiv";el.appendChild(d);
  var s=document.createElement("button");s.className="mi";s.innerHTML=I.gear+"<span>Settings</span>";s.onclick=function(){toast("Not in this demo")};el.appendChild(s);
  var o=document.createElement("button");o.className="mi";o.innerHTML=I.out+"<span>Sign out</span>";o.onclick=function(){openMenu(false);location.reload()};el.appendChild(o);

function buildNav(){
  var n=document.getElementById("nav"),pend=S.notes.filter(function(x){return x.act}).length;

  n.innerHTML=items.map(function(m){var on=ROUTE===m[0]||(m[0]==="timecard"&&ROUTE==="timecard")||(m[0]==="schedule"&&ROUTE==="request");return '<button class="'+(on?"on":"")+'" data-go="'+m[0]+'">'+m[2]+'<span>'+m[1]+'</span>'+(m[0]==="inbox"&&pend?'<span class="bdg">'+pend+'</span>':'')+'</button>'}).join("");

/* ===================== RENDER ===================== */
function bar(title,back){
  var b=document.getElementById("bar");
  if(!back){
    b.innerHTML='<button class="ib" id="mb" aria-label="Menu">'+I.menu+'</button><div class="logo"><div class="wm">UKG</div>'+(CFG.company?'<span class="co">'+esc(CFG.company)+'</span>':'')+'</div><button class="ib" id="sb" aria-label="Search">'+I.search+'</button><button class="ib" id="ab" aria-label="Profile"><div class="av" id="barAv"></div></button>';
    avatar(document.getElementById("barAv"));
    document.getElementById("sb").onclick=function(){toast("Not in this demo")};
    document.getElementById("ab").onclick=function(){openMenu(true)};
  }else{
    b.innerHTML='<button class="ib" id="mb" aria-label="Back">'+I.back+'</button><div class="ttl">'+title+'</div><button class="ib" id="ab" aria-label="Profile"><div class="av" id="barAv"></div></button>';
    avatar(document.getElementById("barAv"));
    document.getElementById("ab").onclick=function(){openMenu(true)};
  }

}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  buildMenu();buildNav();
  var v=document.getElementById("view");
  if(ROUTE==="timecard")return renderTimecard(v);
  if(ROUTE==="schedule")return renderSchedule(v);
  if(ROUTE==="timeoff")return renderTimeOff(v);
  if(ROUTE==="request")return renderRequest(v);
  if(ROUTE==="pay")return renderPay(v);
  if(ROUTE.indexOf("pay-")===0)return renderPayDetail(v,parseInt(ROUTE.slice(4),10));
  if(ROUTE==="inbox")return renderInbox(v);
  renderHome(v);
}
function hour(){var h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}
function hrs(){return TC.reduce(function(a,d){return a+d.h},0);}
function todayRow(){return TC.filter(function(d){return d.today})[0];}
function punchBtn(id){return '<button class="btn sm'+(S.clockedIn?" out":"")+'" id="'+id+'">'+(S.clockedIn?"Punch out":"Punch in")+'</button>';}
function wirePunch(id){
  var t=todayRow();
  document.getElementById(id).onclick=function(){
    var d=new Date(),ts=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    if(S.clockedIn){S.clockedIn=false;t.out=ts;t.h=8;toast("Punched out at "+ts);}
    else{S.clockAt=ts;S.clockedIn=true;t.in=ts;t.out="";t.h=0;toast("Punched in at "+ts);}
    render();
  };
}

  wire(v);wirePunch("ck");

  var act=S.notes.filter(function(n){return n.act}),rest=S.notes.filter(function(n){return !n.act});
  function item(n){return '<div class="cc"><div class="cth"><div class="ic">'+ic[n.kind]+'</div><div><b>'+esc(n.title)+'</b><small>'+esc(n.sub)+'</small></div></div>'+(n.act?'<div class="acts"><button class="btn" data-ok="'+n.id+'">'+(n.kind==="tc"?"Approve":"Accept")+'</button><button class="btn ghost" data-no="'+n.id+'">'+(n.kind==="tc"?"Review":"Decline")+'</button></div>':'')+'</div>';}
  v.innerHTML='<div class="card"><div class="ch"><h3>Needs your action</h3><span class="muted">'+act.length+'</span></div>'+(act.length?act.map(item).join(""):'<div class="cc muted">You are all caught up</div>')+'</div>'+
  '<div class="card"><div class="ch"><h3>Updates</h3></div>'+rest.map(item).join("")+'</div>';
  v.querySelectorAll("[data-ok]").forEach(function(b){b.onclick=function(){var id=+b.dataset.ok,n=S.notes.filter(function(x){return x.id===id})[0];if(n.kind==="tc"){S.notes=S.notes.filter(function(x){return x.id!==id});toast("Timecard approved");}else{n.act=false;n.kind="ok";n.title="Shift swap accepted";toast("Swap accepted");}render();}});
  v.querySelectorAll("[data-no]").forEach(function(b){b.onclick=function(){var id=+b.dataset.no,n=S.notes.filter(function(x){return x.id===id})[0];if(n.kind==="tc"){S.period="last";go("timecard");return;}S.notes=S.notes.filter(function(x){return x.id!==id});toast("Request declined");render();}});
  wire(v);
}

/* ===================== TOAST ===================== */
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},1800);}

/* ===================== BOOT ===================== */
function startApp(){
  document.getElementById("sso").classList.add("hide");
  document.getElementById("app").classList.remove("hide");
  avatar(document.getElementById("menuAv"));
  document.getElementById("menuName").textContent=CFG.name;
  document.getElementById("menuTitle").textContent=CFG.title;
  document.getElementById("menuCo").textContent=CFG.company||"Employee self-service";
  if(hashOK&&location.hash&&location.hash.length>1)ROUTE=location.hash.slice(1);
  render();
}
(function(){
  if(CFG.skip){startApp();return;}
  var step=document.getElementById("step");
  avatar(document.getElementById("ssoAv"));
  document.getElementById("ssoName").textContent=CFG.name;
  document.getElementById("ssoMail").textContent=CFG.email||CFG.title;
  setTimeout(function(){step.textContent="Verifying your identity…";document.getElementById("ssoUser").classList.add("on");},900);
  setTimeout(function(){step.textContent="Signed in. Opening UKG Pro…";document.getElementById("spin").style.display="none";document.getElementById("tick").style.display="grid";},1900);
  setTimeout(startApp,2600);
})();
</script>
